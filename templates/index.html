<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度网盘直链转换</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: #667eea;
            font-size: 16px;
        }
        .loading.show { display: block; }
        .result {
            margin-top: 20px;
            display: none;
        }
        .result.show { display: block; }
        .success {
            background: #d4edda;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
        }
        .file-item {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
        }
        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .file-link {
            background: white;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            font-size: 11px;
            font-family: monospace;
            border: 1px solid #e0e0e0;
            margin-bottom: 12px;
            max-height: 80px;
            overflow-y: auto;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .copy-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }
        .download-btn {
            background: #28a745;
        }
        .download-btn:hover {
            background: #218838;
        }
        .download-tip {
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 4px;
            font-size: 12px;
            color: #856404;
        }
        .progress-bar {
            display: none;
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar.show {
            display: block;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 百度网盘直链转换</h1>
        <p class="subtitle">分享链接 → 自动转存 → 下载直链</p>
        
        <form id="convertForm">
            <div class="form-group">
                <label>访问密码</label>
                <input type="password" name="token" placeholder="请输入访问密码" required>
            </div>
            <div class="form-group">
                <label>分享链接</label>
                <input type="text" name="link" placeholder="https://pan.baidu.com/s/xxxxx" required>
            </div>
            <div class="form-group">
                <label>提取码（可选）</label>
                <input type="text" name="pwd" placeholder="若有提取码请输入">
            </div>
            <button type="submit">开始转换</button>
        </form>

        <div class="loading">⏳ 正在转换，预计需要 15-30 秒...</div>

        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('convertForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const loading = document.querySelector('.loading');
            const result = document.getElementById('result');
            const btn = form.querySelector('button');
            
            const data = {
                token: form.token.value,
                link: form.link.value.trim(),
                pwd: form.pwd.value.trim()
            };
            
            loading.classList.add('show');
            result.classList.remove('show');
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const res = await response.json();
                
                if (res.success && res.items) {
                    result.innerHTML = `
                        <div class="success">
                            <h3>✅ 成功获取 ${res.items.length} 个下载链接</h3>
                            ${res.items.map((file, i) => `
                                <div class="file-item">
                                    <div class="file-name">📄 ${escapeHtml(file.filename)}</div>
                                     <div class="file-link" id="link-${i}">${escapeHtml(window.location.origin + file.download_url)}</div>
                                    <div class="btn-group">
                                        <button class="copy-btn" onclick="copyLink(${i})">📋 复制链接</button>
                                        <button class="copy-btn download-btn" onclick="directDownload(${i})">⬇️ 直接下载</button>
                                    </div>
                                    <div class="progress-bar" id="progress-${i}">
                                        <div class="progress-fill" id="progress-fill-${i}">0%</div>
                                    </div>
                                    <div class="download-tip">
                                        💡 提示：链接会先访问本服务的 /d/download，再 302 跳转到百度真实下载地址
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="error">
                            <h3>❌ 转换失败</h3>
                            <p>${escapeHtml((res.error && res.error.message) || '未知错误')}</p>
                        </div>
                    `;
                }
                
                result.classList.add('show');
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        <h3>❌ 网络错误</h3>
                        <p>${escapeHtml(error.message)}</p>
                    </div>
                `;
                result.classList.add('show');
            } finally {
                loading.classList.remove('show');
                btn.disabled = false;
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyLink(index) {
            const element = document.getElementById('link-' + index);
            const text = element.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ 链接已复制到剪贴板！\n\n可以使用 IDM、aria2 等工具下载');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✅ 链接已复制到剪贴板！');
            });
        }

        function directDownload(index) {
            const element = document.getElementById('link-' + index);
            const url = element.textContent;
            window.location.href = url;
        }
    </script>
</body>
</html>
