name: baidupcs-relay

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:-1.91}
    image: baidupcs-relay-rs:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-5200}:5200"
    environment:
      PORT: "5200"
      RUST_LOG: ${RUST_LOG:-baidu_direct_link=info,web_server=info}
      BDUSS: ${BDUSS:?BDUSS is required}
      STOKEN: ${STOKEN:?STOKEN is required}
      SAVE_PATH: ${SAVE_PATH:-/文档加工}
      HTTP_TIMEOUT_SECS: ${HTTP_TIMEOUT_SECS:-30}
      WEB_ACCESS_TOKEN: ${WEB_ACCESS_TOKEN:?WEB_ACCESS_TOKEN is required}
      WEB_SIGN_SECRET: ${WEB_SIGN_SECRET:?WEB_SIGN_SECRET is required}
      BAIDU_ACCESS_TOKEN: ${BAIDU_ACCESS_TOKEN:-}
      BAIDU_REFRESH_TOKEN: ${BAIDU_REFRESH_TOKEN:-}
      BAIDU_CLIENT_ID: ${BAIDU_CLIENT_ID:-}
      BAIDU_CLIENT_SECRET: ${BAIDU_CLIENT_SECRET:-}
      BAIDU_REDIRECT_URI: ${BAIDU_REDIRECT_URI:-oob}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/baidu-web-server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 10s
